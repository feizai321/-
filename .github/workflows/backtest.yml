name: Football Goals Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "football-goals-backtest/src/**"
      - "football-goals-backtest/config/**"
      - "football-goals-backtest/requirements.txt"
      - "football-goals-backtest/.github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: football-goals-backtest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        working-directory: football-goals-backtest
        run: python src/backtest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: football-goals-backtest-results
          path: football-goals-backtest/results/
          retention-days: 30
